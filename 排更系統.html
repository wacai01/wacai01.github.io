<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排更系統 · 香港餐飲集團</title>
<style>
:root{
  --primary:#2C5F8A; --primary-dark:#1F4768; --bg:#F2F5F9; --card:#ffffff;
  --text:#23272F; --muted:#6B7280; --border:#E2E8F0;
  --yellow:#FFD966; --green:#9FE2A0; --blue:#7EC8F7; --purple:#B39DDB; --gray:#D9DEE5;
  --danger:#E5533C; --success:#2F9E5F; --warn:#E8A33D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#E8EDF3;color:var(--text)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn-link{background:none;border:none;color:var(--primary);text-decoration:underline;padding:0}
/* 登入頁 */
#view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1F4768 0%,#2C5F8A 55%,#4A86B8 100%)}
.login-wrap{width:min(960px,94vw);display:flex;gap:28px;align-items:stretch}
.login-card{flex:1;background:rgba(255,255,255,.97);border-radius:16px;padding:34px 38px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h1{font-size:24px;color:var(--primary-dark);margin-bottom:4px}
.login-card .sub{color:var(--muted);margin-bottom:22px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#444}
.demo-list{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:30px 34px;color:#fff}
.demo-list h2{font-size:19px;margin-bottom:16px}
.demo-group{margin-bottom:18px}
.demo-group .g-title{font-size:13px;font-weight:700;color:#FFE9A8;margin-bottom:8px}
.demo-acc{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;margin-bottom:6px;font-size:13px}
.demo-acc small{color:#C9E0F2}
.demo-acc .btn{background:rgba(255,255,255,.85);color:var(--primary-dark);padding:4px 12px;font-size:12px;border-radius:7px}
.err-msg{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}
/* 主框架 */
#view-main{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--primary);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{font-size:18px;font-weight:800;letter-spacing:1px}
.header-user{display:flex;align-items:center;gap:12px;font-size:13px}
.header-user .role-tag{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;font-size:12px}
nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:none;padding:12px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
main{padding:22px 26px;max-width:1500px;width:100%;margin:0 auto;flex:1}
.page-title{font-size:20px;font-weight:800;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card+.card{margin-top:16px}
.card-title{font-size:15px;font-weight:800;margin-bottom:12px;color:var(--primary-dark)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
/* 統計卡 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}
.stat-card .num{font-size:30px;font-weight:900;color:var(--primary)}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
/* 更表 */
.roster-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px}
.roster-table th{background:var(--primary);color:#fff;padding:8px 6px;font-size:12px;min-width:86px}
.roster-table th small{font-weight:400;opacity:.85}
.roster-table td{border:1px solid var(--border);padding:6px;text-align:center;vertical-align:middle}
.roster-table td.emp-col{background:#F7F9FC;font-weight:700;text-align:left;min-width:120px;position:sticky;left:0}
.roster-table td.emp-col small{color:var(--muted);font-weight:400}
.roster-table tr.me-row td.emp-col{background:#FFF3D6}
.roster-table tr.me-row td:not(.emp-col){outline:2px solid #E8A33D;outline-offset:-2px}
.roster-table .cell{cursor:pointer;min-height:56px}
.roster-table .cell.editable:hover{outline:2px solid var(--primary);outline-offset:-2px}
.roster-table .cell.drag-over{outline:3px dashed var(--success);outline-offset:-3px;background:#E9FBEF!important}
.shift-name{font-weight:800;font-size:13px;display:block}
.roster-table .tiny{font-size:10px;opacity:.85}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 0}
.legend .item{display:flex;align-items:center;gap:6px;font-size:12px;color:#444}
.legend .swatch{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.12);display:inline-block}
/* 排更編輯 */
.shift-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.shift-chip{padding:10px 18px;border-radius:10px;font-weight:800;cursor:grab;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.15);font-size:13px}
.shift-chip small{display:block;font-weight:400;font-size:11px;opacity:.85}
.shift-chip.dragging{opacity:.5}
.edit-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.edit-form .f-item label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:4px}
/* 請求 */
.req-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.req-card .r-info{flex:1;min-width:220px}
.req-card .r-info b{font-size:14px}
.req-card .r-info small{color:var(--muted)}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-pending{background:#FDF0D7;color:#9A6B00}
.badge-approved{background:#DCF5E6;color:#1E7A4A}
.badge-rejected{background:#FDE3DE;color:#A83A28}
.status-pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.status-pill.p0{background:#FDF0D7;color:#9A6B00}
.status-pill.p1{background:#DCF5E6;color:#1E7A4A}
.status-pill.p2{background:#FDE3DE;color:#A83A28}
/* 儀表板 bar */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.bar-row .b-label{width:46px;color:var(--muted);text-align:right}
.bar-track{flex:1;background:#EEF2F7;border-radius:8px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:var(--primary);transition:width .3s}
.bar-row .b-val{width:44px;font-weight:700}
/* 月視圖 */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.month-grid .m-head{text-align:center;font-weight:800;font-size:12px;color:var(--muted);padding:4px}
.month-cell{background:#fff;border:1px solid var(--border);border-radius:10px;min-height:96px;padding:8px;cursor:pointer;position:relative;transition:box-shadow .15s}
.month-cell:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.month-cell.other{opacity:.4}
.month-cell .d-num{font-weight:800;font-size:13px}
.month-cell.today{border-color:var(--primary);box-shadow:0 0 0 2px rgba(44,95,138,.25)}
.month-cell .m-att{font-size:11px;color:var(--muted);margin-top:4px}
.month-cell .m-shifts{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.m-shift-line{font-size:11px;border-radius:5px;padding:1px 6px;font-weight:600;color:#333}
/* 模態框 */
#modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;width:min(520px,94vw);max-height:88vh;overflow:auto;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:17px;margin-bottom:16px;color:var(--primary-dark)}
.modal .form-row{margin-bottom:12px}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* 表格數據 */
.data-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
.data-table th{background:#EDF1F7;padding:8px 10px;text-align:left;font-size:12px;color:#444}
.data-table td{padding:8px 10px;border-top:1px solid var(--border)}
/* 分店切換 */
.branch-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.branch-tab{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
.branch-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.footer-note{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
.btn-danger{background:#d9534f;color:#fff}
.btn-danger:hover{background:#c9302c}
/* 日視圖 */
.day-grid{position:relative;min-width:760px;overflow-x:auto}
.day-ghead{display:flex;align-items:stretch;border-bottom:2px solid var(--border)}
.day-emp-head{width:110px;flex:0 0 110px;font-size:12px;font-weight:700;padding:6px;color:#555;box-sizing:border-box}
.day-timeline{position:relative;flex:1;display:flex;align-items:stretch}
.day-h{flex:1;border-left:1px solid #e8ecf2;font-size:10px;color:var(--muted);padding:3px 0 0 3px;box-sizing:border-box;overflow:hidden}
.day-row{display:flex;align-items:stretch}
.day-emp{width:110px;flex:0 0 110px;display:flex;flex-direction:column;justify-content:center;font-size:12px;font-weight:600;padding:2px 6px;box-sizing:border-box}
.day-emp small{font-weight:400;color:var(--muted);font-size:10px}
.day-row .day-timeline{height:36px;border-bottom:1px solid #f0f2f6;background:repeating-linear-gradient(90deg,transparent,transparent calc(100%/24 - 1px),#eef1f5 calc(100%/24 - 1px),#eef1f5 calc(100%/24))}
.day-bar{position:absolute;top:2px;bottom:2px;border-radius:6px;overflow:hidden;display:block;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.day-bar-label{position:absolute;left:6px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;font-weight:600;color:#333;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 2px #fff}
.day-break{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#5b2c2c,#5b2c2c 3px,#7a3b3b 3px,#7a3b3b 6px);border-left:1px solid rgba(255,255,255,.6);border-right:1px solid rgba(255,255,255,.6);z-index:2}
.day-break-swatch{width:16px;height:16px;border-radius:4px;background:repeating-linear-gradient(45deg,#5b2c2c,#5b2c2c 3px,#7a3b3b 3px,#7a3b3b 6px)}
.day-note{color:#d33;font-size:12px;padding:8px 10px}
@media(max-width:860px){ .login-wrap{flex-direction:column} .roster-table td.emp-col{position:static} }

/* 日視圖：高亮自己的班次 */
.day-row.me-day-row .day-emp{background:#FFF3D6}
.day-row.me-day-row .day-timeline{outline:2px solid #E8A33D;outline-offset:-2px}

/* ===== 本輪新增：配額 / 空缺認投 / 偏好 ===== */
.quota-table td{font-size:12px;vertical-align:top;text-align:center}
.quota-miss{background:#FDF0D7;color:#9A6B00}
.quota-ok{background:#F2FAF5;color:#2a6}
.quota-table .tiny{font-size:10px;color:#d33;font-weight:700}
.pref-table th{font-size:12px}
.pref-table th small{font-weight:400;font-size:10px;color:var(--muted)}
.pref-table td{text-align:center}
.pref-table input[type="checkbox"]{width:16px;height:16px;cursor:pointer}
.btn-sm{padding:5px 12px;font-size:12px}


/* ===== 本輪新增：配額 / 空缺認投 / 偏好 ===== */
.quota-table td{font-size:12px;vertical-align:top;text-align:center}
.quota-miss{background:#FDF0D7;color:#9A6B00}
.quota-ok{background:#F2FAF5;color:#2a6}
.quota-table .tiny{font-size:10px;color:#d33;font-weight:700}
.pref-table th{font-size:12px}
.pref-table th small{font-weight:400;font-size:10px;color:var(--muted)}
.pref-table td{text-align:center}
.pref-table input[type="checkbox"]{width:16px;height:16px;cursor:pointer}
.btn-sm{padding:5px 12px;font-size:12px}


/* === v3 擴充樣式 === */
.pt-row td{ background:#FFF3E0; }
.ft-row td{ background:#E8F1FF; }
.me-row td{ background:#FFF9C4 !important; }
.emp-tag{ font-weight:700; }
.over-tag{ display:inline-block; color:#fff; background:#d33; border-radius:6px; padding:1px 6px; font-size:10px; font-weight:700; margin-top:2px; }
.full-tag{ display:inline-block; color:#fff; background:#d33; border-radius:8px; padding:4px 10px; font-size:12px; font-weight:700; }
.holiday-chip{ display:inline-flex; align-items:center; background:#FFF0F5; border:1px solid #F2A0B4; border-radius:8px; padding:4px 8px; font-size:12px; }
.chip{ display:inline-flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; }
.quota-na{ color:var(--muted); background:#F1F3F5; text-align:center; font-size:11px; padding:6px 10px; border-radius:8px; }
</style>
</head>
<body>
<div id="app">

<!-- ===================== 登入頁 ===================== -->
<div id="view-login">
  <div class="login-wrap">
    <div class="login-card">
      <h1>排更系統</h1>
      <div class="sub">香港餐飲集團 · 員工更表管理平台</div>
      <div class="err-msg" id="login-err"></div>
      <div class="form-row">
        <label>角色</label>
        <select id="login-role" style="width:100%">
          <option value="boss">老闆（公司總覽）</option>
          <option value="manager">分店經理</option>
          <option value="employee">分店員工</option>
        </select>
      </div>
      <div class="form-row" id="login-branch-row">
        <label>分店</label>
        <select id="login-branch" style="width:100%"></select>
      </div>
      <div class="form-row">
        <label>用戶名稱</label>
        <input id="login-user" placeholder="輸入用戶名稱" style="width:100%">
      </div>
      <div class="form-row">
        <label>密碼</label>
        <input id="login-pass" type="password" placeholder="輸入密碼" style="width:100%">
      </div>
      <button class="btn btn-primary" style="width:100%;padding:11px" onclick="doLogin()">登入</button>
      <div style="margin-top:14px;font-size:12px;color:var(--muted)">提示：可直接使用右方示範帳號一鍵登入體驗各角色。</div>
    </div>
    <div class="demo-list" id="demo-list"></div>
  </div>
</div>

<!-- ===================== 主界面 ===================== -->
<div id="view-main" class="hidden">
  <header>
    <div class="brand">📋 排更系統</div>
    <div class="header-user">
      <span id="hdr-user"></span>
      <span class="role-tag" id="hdr-role"></span>
      <button class="btn btn-secondary btn-sm" onclick="logout()">登出</button>
    </div>
  </header>
  <nav id="navbar"></nav>
  <main id="content"></main>
</div>

<!-- ===================== 模態框 ===================== -->
<div id="modal-backdrop" class="hidden">
  <div class="modal" id="modal-body"></div>
</div>

</div>

<script>
/* ================================================================
   排更系統 · 單檔 HTML 應用（localStorage 持久化，無後端）
   ================================================================ */
const DB_KEY = 'hk_roster_v1';
let db = { company:{}, branches:[], users:[], shifts:[], schedules:[], requests:[], locations:[] };
const state = { userId:null, weekStart:new Date(), monthY:2026, monthM:9, bossBranchId:null, dragShiftId:null, dayDate:null };

/* ---------------- 工具函數 ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function getMonday(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function genId(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
const WEEKDAYS=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
function weekdayName(d){ return WEEKDAYS[(d.getDay()+6)%7]; }
function fmtMD(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtFull(d){ return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
function todayStr(){ return toDateStr(new Date()); }
function hoursBetween(start,end,crossDay,breakStr){
  const [sh,sm]=start.split(':').map(Number); let [eh,em]=end.split(':').map(Number);
  if(crossDay) eh+=24;
  let mins=(eh*60+em)-(sh*60+sm);
  if(breakStr && breakStr.includes('-')){
    const b=breakStr.split('-');
    const [bh,bm]=b[0].split(':').map(Number); const [bh2,bm2]=b[1].split(':').map(Number);
    mins-=((bh2*60+bm2)-(bh*60+bm));
  }
  return Math.max(0, Math.round(mins/60*10)/10);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- 示範資料 ---------------- */
function seedDB(){
  const now=new Date();
  db.company = { name:'香港餐飲集團', createdAt: now.toISOString() };
  db.branches = [
    { id:'b1', name:'中環分店', address:'中環德輔道中 88 號' },
    { id:'b2', name:'旺角分店', address:'旺角彌敦道 600 號' }
  ];
  db.locations = [
    { id:'l1', branchId:'b1', name:'中環店' }, { id:'l2', branchId:'b1', name:'上環店' },
    { id:'l3', branchId:'b2', name:'旺角店' }, { id:'l4', branchId:'b2', name:'油麻地店' }
  ];
  db.positions = [
    { id:'p1', name:'收銀' }, { id:'p2', name:'樓面' }, { id:'p3', name:'廚房' },
    { id:'p4', name:'水吧' }, { id:'p5', name:'傳菜' }
  ];
  db.users = [
    { id:'u_boss', name:'陳大文', role:'boss', branchId:null, username:'boss', password:'boss123', defaultPosition:'—', empType:'fulltime' },
    { id:'u_m1', name:'李志明', role:'manager', branchId:'b1', username:'m1', password:'123456', defaultPosition:'經理', empType:'fulltime' },
    { id:'u_m2', name:'王美玲', role:'manager', branchId:'b2', username:'m2', password:'123456', defaultPosition:'經理', empType:'fulltime' },
    { id:'u_s1', name:'張小明', role:'employee', branchId:'b1', username:'s1', password:'123456', defaultPosition:'收銀', empType:'fulltime' },
    { id:'u_s2', name:'陳小美', role:'employee', branchId:'b1', username:'s2', password:'123456', defaultPosition:'樓面', empType:'parttime', prefs:[{d:1,shiftId:'s_early'},{d:2,shiftId:'s_late'},{d:4,shiftId:'s_late'},{d:5,shiftId:'s_mid'}] },

function genWeekSchedule(){
  const weekStart=getMonday(new Date());
  for(let bi=0;bi<db.branches.length;bi++){
    const b=db.branches[bi];
    const emps=db.users.filter(u=>u.role==='employee' && u.branchId===b.id);
    const locs=db.locations.filter(l=>l.branchId===b.id);
    for(let ei=0;ei<emps.length;ei++){
      const emp=emps[ei];
      const days = emp.empType==='parttime' ? [0,1,2] : [0,1,2,3,4];
      for(let di=0;di<days.length;di++){
        const ds=toDateStr(addDays(weekStart,days[di]));
        autoAssignShift(emp, ds, locs, emp.defaultPosition||'');
      }
    }
  }
}

function currentUser(){ return db.users.find(u=>u.id===state.userId)||null; }
function currentBranch(){ const u=currentUser(); if(!u) return null; return db.branches.find(b=>b.id===u.branchId)||null; }
function userBranchId(){ const u=currentUser(); return u.role==='boss' ? (state.bossBranchId||db.branches[0].id) : u.branchId; }
function shiftById(id){ return db.shifts.find(s=>s.id===id)||null; }
function userById(id){ return db.users.find(u=>u.id===id)||null; }
function branchById(id){ return db.branches.find(b=>b.id===id)||null; }
function locOptions(branchId){ return db.locations.filter(l=>l.branchId===branchId).map(l=>l.name); }
function employeesOf(branchId){ return db.users.filter(u=>u.role==='employee' && u.branchId===branchId); }
function schMap(branchId){
  const m={};
  db.schedules.forEach(s=>{ if(s.branchId===branchId) m[s.employeeId+'|'+s.date]=s; });
  return m;
}
function isWorking(sch){ if(!sch) return false; const st=shiftById(sch.shiftId); return st && !st.isRest; }
function leaveOn(employeeId, date){
  return db.requests.find(r=>r.employeeId===employeeId && r.status==='approved' && r.dateFrom<=date && date<=r.dateTo)||null;
}
function attendanceOf(branchId,date){
  const emps=employeesOf(branchId);
  const m=schMap(branchId);
  return emps.filter(e=>isWorking(m[e.id+'|'+date]) && !leaveOn(e.id,date)).length;
}

function fillLoginBranch(){
  const sel=document.getElementById('login-branch');
  sel.innerHTML='';
  db.branches.forEach(b=>{ const o=document.createElement('option'); o.value=b.id; o.textContent=b.name; sel.appendChild(o); });
  document.getElementById('login-branch-row').style.display = document.getElementById('login-role').value==='boss' ? 'none':'block';
}
function doLogin(){
  const role=document.getElementById('login-role').value;
  const branchId=document.getElementById('login-branch').value;
  const user=document.getElementById('login-user').value.trim();
  const pass=document.getElementById('login-pass').value;
  const u=db.users.find(x=>x.username===user && x.password===pass && x.role===role);
  if(!u){ document.getElementById('login-err').textContent='用戶名稱或密碼錯誤，請重試。'; return; }
  if(role!=='boss' && u.branchId!==branchId){ document.getElementById('login-err').textContent='該帳號不屬於所選分店。'; return; }
  loginAs(u.id);
}
function loginAs(uid){
  const u=userById(uid); if(!u) return;
  state.userId=uid;
  state.weekStart=getMonday(new Date());
  const d=new Date(); state.monthY=d.getFullYear(); state.monthM=d.getMonth();
  state.bossBranchId = u.role==='boss' ? db.branches[0].id : u.branchId;
  renderHeader();
  gotoHome();
}
function logout(){ state.userId=null; showLogin(); }
function gotoHome(){
  const u=currentUser();
  if(u.role==='boss') go('dashboard');
  else if(u.role==='manager') go('schedule');
  else go('eschedule');
}
function showLogin(){
  document.getElementById('view-login').classList.remove('hidden');
  document.getElementById('view-main').classList.add('hidden');
  fillLoginBranch(); renderDemoList();
  document.getElementById('login-err').textContent='';
}

function weekGridHTML(bId, editable){
  const days=[...Array(7)].map((_,i)=>addDays(state.weekStart,i));
  const emps=employeesOf(bId);
  const m=schMap(bId);
  let h='<table class="roster-table"><thead><tr><th class="emp-col">員工</th>';
  days.forEach(d=>{ h+='<th>'+weekdayName(d)+'<br><small>'+fmtMD(d)+'</small></th>'; });
  h+='</tr></thead><tbody>';
  emps.forEach(emp=>{
    const isMe=state.userId===emp.id;
    const isPt=emp.empType==='parttime';
    const rowCls=(isPt?' pt-row':' ft-row')+(isMe?' me-row':'');
    let overMark='';
    if(!isPt){
      const wst=weekWorkStats(emp.id,bId);
      const hMax=emp.ftHoursMax!=null?emp.ftHoursMax:40;
      const dMax=emp.ftDaysMax!=null?emp.ftDaysMax:5;
      if(wst.hours>hMax || wst.days>dMax) overMark='<br><span class="over-tag">⚠ 超標</span>';
    }
    h+='<tr class="'+rowCls.trim()+'"><td class="emp-col"><strong>'+empLabel(emp)+'</strong><br><small>'+esc(emp.defaultPosition||'')+'</small>'+overMark+'</td>';
    days.forEach(d=>{
      const ds=toDateStr(d);
      const sch=m[emp.id+'|'+ds];
      h+=cellHTML(emp.id, ds, sch, editable);
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  return h;
}
function cellHTML(eid, ds, sch, editable){
  const leave = leaveOn(eid, ds);
  if(leave){
    const tip='員工 '+esc(userById(eid)?userById(eid).name:'')+' | '+ds+' | 請假('+esc(leave.type)+' '+esc(leave.dateFrom)+'~'+esc(leave.dateTo)+')';
    return '<td class="cell leave-cell'+(editable?' editable':'')+'" data-eid="'+eid+'" data-date="'+ds+'" style="background:#F6D7D9" title="'+esc(tip)+'"><span class="shift-name">請假</span><small>'+esc(leave.type)+'</small></td>';
  }
  let bg='#fff', inner='<span class="shift-name">—</span>';
  if(sch){
    const st=shiftById(sch.shiftId);
    if(st){ bg=st.color;
      if(st.isRest){ inner='<span class="shift-name">休息</span>'; }
      else{
        inner='<span class="shift-name">'+esc(st.name)+'</span><small>'+esc(st.start)+'-'+esc(st.end)+(st.crossDay?'<sup>+1</sup>':'')+'</small><br><small class="tiny">'+esc(sch.location||'')+' · '+esc(sch.position||'')+'</small>';
      }
    }
  }
  const empName = userById(eid) ? userById(eid).name : '';
  const stSh = sch ? shiftById(sch.shiftId) : null;
  const shName = stSh ? stSh.name : '';
  const tip = sch ? ('員工 '+esc(empName)+' | '+ds+' | '+esc(shName)+' | '+esc(sch.location||'')+' | '+esc(sch.position||'')) : '';
  return '<td class="cell'+(editable?' editable':'')+'" data-eid="'+eid+'" data-date="'+ds+'" style="background:'+bg+'" title="'+esc(tip)+'">'+inner+'</td>';
}

function setSchedule(eid, ds, shiftId, location, position){
  const u=currentUser();
  const bId = u.role==='boss' ? state.bossBranchId : u.branchId;
  const idx=db.schedules.findIndex(s=>s.employeeId===eid && s.date===ds);
  const st=shiftById(shiftId);
  if(!st || st.isRest){ if(idx>=0){ db.schedules.splice(idx,1); } }
  else{
    if(!shiftAppliesOn(st, ds)){
      alert('該班次「'+st.name+'」不適用於 '+ds+'（星期 / 公眾假期設定不符），請選擇當日適用的班次。');
      return false;
    }
    const sameShift = idx>=0 && db.schedules[idx].shiftId===shiftId;
    if(!sameShift){
      const alreadyThere=db.schedules.some(s=>s.employeeId===eid && s.date===ds && s.shiftId===shiftId);
      if(!alreadyThere){
        const emp=userById(eid);
        const isPart = emp && emp.empType==='parttime';
        const qst=quotaStatus(bId, ds, shiftId);
        const dimMiss = isPart ? qst.missingPart : qst.missingFull;
        if(dimMiss<=0){
          alert('該更份的'+(isPart?'兼職':'全職')+'配額已滿（全職 '+qst.full+'/'+qst.qFull+'、兼職 '+qst.part+'/'+qst.qPart+'），無法再新增該類型排班，請先調整合員。');
          return false;
        }
      }
    }
    const obj={ id:idx>=0?db.schedules[idx].id:genId(), branchId:bId, employeeId:eid, date:ds, shiftId, location:location||'', position:position||'' };
    if(idx>=0) db.schedules[idx]=obj; else db.schedules.push(obj);
  }
  saveDB(); parttimeLimitAlert(eid, ds, shiftId); fulltimeLimitAlert(eid, ds, shiftId); go('schedule');
}

  const first=new Date(state.monthY, state.monthM, 1);
  const lead=(first.getDay()+6)%7;

  const today=todayStr();
  for(let i=0;i<lead;i++) h+='<div></div>';
  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(state.monthY, state.monthM, day);
    const ds=toDateStr(d);

    const m=schMap(bId); const cnt={};
    employeesOf(bId).forEach(e=>{ const s=m[e.id+'|'+ds]; if(s && isWorking(s) && !leaveOn(e.id,ds)){ const st=shiftById(s.shiftId); cnt[st.name]=(cnt[st.name]||0)+1; } });

function monthJump(dir){
  if(dir===0){ const d=new Date(); state.monthY=d.getFullYear(); state.monthM=d.getMonth(); }
  else{ state.monthM+=dir; if(state.monthM<0){ state.monthM=11; state.monthY--; } if(state.monthM>11){ state.monthM=0; state.monthY++; } }
  go('month');
}

function reqCardHTML(r, actionable){

    if(/^image\//.test(att.type||'')){
      h+='<br><a href="'+esc(att.data)+'" target="_blank" rel="noopener"><img src="'+esc(att.data)+'" style="max-height:60px;max-width:130px;border-radius:6px;border:1px solid var(--border);margin-top:4px" alt="附件"></a>';

  if(r.rejectReason) h+='<br><small style="color:#d33">拒絕原因：'+esc(r.rejectReason)+'</small>';

  h+='</div>';
  if(actionable){
    h+='<button class="btn btn-success btn-sm" onclick="reviewRequest(\''+r.id+'\',\'approved\')">✓ 批准</button>';
    h+='<button class="btn btn-danger btn-sm" onclick="reviewRequest(\''+r.id+'\',\'rejected\')">✕ 拒絕</button>';

  h+='<button class="btn btn-secondary btn-sm" onclick="openEditRequestModal(\''+r.id+'\')">✏️ 編輯狀態</button>';

function reviewRequest(id, status){
  const r=db.requests.find(x=>x.id===id); if(!r) return;
  const u=currentUser();
  let reason='';
  if(status==='rejected'){
    reason=prompt('請填寫拒絕原因（必填）：');
    if(reason==null) return;
    reason=reason.trim();
    if(!reason){ alert('拒絕原因不能為空。'); return; }
  }
  r.status=status;
  r.processedAt=new Date().toISOString();
  r.processedBy=u.name;
  if(status==='rejected') r.rejectReason=reason; else if(status==='approved') r.rejectReason='';
  r.history.push({status:status, at:r.processedAt, by:u.name, reason:reason});
  saveDB(); go('requests');
}

function nowMonth(){ const d=new Date(); return [d.getFullYear(), d.getMonth()]; }
function fmtDateTime(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return d.getFullYear()+'/'+String(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function monthWorkHours(empId, y, m){
  let total=0;
  db.schedules.forEach(s=>{
    if(s.employeeId!==empId || !isWorking(s) || leaveOn(s.employeeId,s.date)) return;
    const p=s.date.split('-'); const sy=parseInt(p[0],10); const sm=parseInt(p[1],10)-1;
    if(sy!==y || sm!==m) return;
    const st=shiftById(s.shiftId); if(!st) return;
    total+=hoursBetween(st.start,st.end,st.crossDay,st.break);
  });
  return Math.round(total*10)/10;
}
function parttimeLimitAlert(eid, ds, shiftId){
  const u=db.users.find(x=>x.id===eid); if(!u || u.empType!=='parttime') return false;
  const st=shiftById(shiftId); if(!st || st.isRest) return false;
  const add=hoursBetween(st.start,st.end,st.crossDay,st.break);
  const mArr=nowMonth();
  let base=0;
  db.schedules.forEach(s=>{
    if(s.employeeId!==eid || !isWorking(s) || leaveOn(s.employeeId,s.date)) return;
    if(ds && s.date===ds) return;
    const p=s.date.split('-'); const sy=parseInt(p[0],10); const sm=parseInt(p[1],10)-1;
    if(sy!==mArr[0] || sm!==mArr[1]) return;
    const st2=shiftById(s.shiftId); if(!st2) return;
    base+=hoursBetween(st2.start,st2.end,st2.crossDay,st2.break);
  });
  const total=Math.round((base+add)*10)/10;
  if(total>68){
    alert('警告：兼職員工「'+u.name+'」本月已排 '+Math.round(base*10)/10+' 小時，加上本次新增 '+add+' 小時共 '+total+' 小時，已超過 68 小時上限！請留意排班安排。');
    return true;
  }
  return false;
}

function saveShift(id){
  const s=db.shifts.find(x=>x.id===id); if(!s) return;
  s.name=document.getElementById('sh-name-'+id).value.trim()||s.name;
  s.start=document.getElementById('sh-start-'+id).value||s.start;
  s.end=document.getElementById('sh-end-'+id).value||s.end;
  s.crossDay=document.getElementById('sh-cross-'+id).value==='1';
  s.break=document.getElementById('sh-break-'+id).value.trim();
  const qfEl=document.getElementById('sh-qf-'+id); if(qfEl) s.quotaFull=Math.max(0, parseInt(qfEl.value,10)||0);
  const qpEl=document.getElementById('sh-qp-'+id); if(qpEl) s.quotaPart=Math.max(0, parseInt(qpEl.value,10)||0);
  const c=document.getElementById('sh-color-'+id); if(c) s.color=c.value;
  const days=[];
  ['1','2','3','4','5','6','7','0'].forEach(function(k){
    const el=document.getElementById('sh-day-'+id+'-'+k);
    if(el && el.checked) days.push(+k);
  });
  s.days=days;
  saveDB();
  const removed=enforceQuota();
  alert('班次「'+s.name+'」已更新，更表配額、空缺判斷與工時計算已即時生效。'+(removed>0?'（已自動移除 '+removed+' 筆超額排班，保留先排者）':''));
  go('shifts');
}

      const widthPct=(total/1440*100);
      const endHm=pad(Math.floor(end/60))+':'+pad(end%60);
      const titleTxt=r.fromPrev?(esc(r.st.name)+'（跨日班次，自昨日 '+esc(r.st.start)+' 開始，今日 '+endHm+' 結束）'):(esc(r.st.name)+' '+esc(r.st.start)+'-'+esc(r.st.end)+(r.st.crossDay?'（跨日）':''));
      const labelTxt=r.fromPrev?(esc(r.st.name)+' 00:00-'+esc(r.st.end)+'（跨日）'):(esc(r.st.name)+' '+esc(r.st.start)+'-'+(r.st.crossDay?'24:00（跨日）':esc(r.st.end)));
      h+='<div class="day-bar" style="left:'+leftPct.toFixed(2)+'%;width:'+widthPct.toFixed(2)+'%;background:'+r.st.color+'" title="'+titleTxt+'">';
      h+='<span class="day-bar-label">'+labelTxt+'</span>';
      if(r.st.break && r.st.break.includes('-')){
        const bp=r.st.break.split('-');
        const bs=dayTimeToMin(bp[0]); const be=dayTimeToMin(bp[1]);
        const bsC=Math.max(bs,start); const beC=Math.min(be,end);
        if(beC>bsC){
          const bl=((bsC-start)/total*100); const bw=((beC-bsC)/total*100);
          h+='<div class="day-break" style="left:'+bl.toFixed(2)+'%;width:'+bw.toFixed(2)+'%"></div>';
        }
      }
      h+='</div>';
    }
    h+='</div></div>';
  });
  h+='</div></div>';
  return h;
}

function ensureWeekScheduleFor(ns){
  if(!db.branches || !Array.isArray(db.branches)) return;
  const weekStart=getMonday(new Date());
  const has=db.schedules.some(s=>s.employeeId===ns.id && s.date>=toDateStr(weekStart) && s.date<=toDateStr(addDays(weekStart,6)));
  if(has) return;
  const locs=Array.isArray(db.locations)?db.locations.filter(l=>l.branchId===ns.branchId):[];
  const days = ns.empType==='parttime' ? [0,1,2] : [0,1,2,3,4];
  days.forEach(di=>{
    const ds=toDateStr(addDays(weekStart,di));
    autoAssignShift(ns, ds, locs, ns.defaultPosition||'');
  });
}
function seedClaims(){
  const ws=getMonday(new Date());
  const nextMon=toDateStr(addDays(ws,7));
  const locs=db.locations.filter(l=>l.branchId==='b1');
  db.schedules.push({ id:genId(), branchId:'b1', employeeId:'u_s2', date:nextMon, shiftId:'s_late', location:(locs[0]?locs[0].name:''), position:'樓面' });
  db.claims.push({ id:genId(), employeeId:'u_s2', branchId:'b1', date:nextMon, shiftId:'s_late', claimedAt:new Date().toISOString(), status:'claimed' });
}
function quotaOf(shiftId){
  const s=shiftById(shiftId);
  return { full:(s&&s.quotaFull)||0, part:(s&&s.quotaPart)||0 };
}
function quotaStatus(bId, ds, shiftId){
  const schs=db.schedules.filter(x=>x.branchId===bId && x.date===ds && x.shiftId===shiftId && isWorking(x) && !leaveOn(x.employeeId,ds));
  let full=0, part=0;
  schs.forEach(x=>{ const u=userById(x.employeeId); if(u && u.empType==='parttime') part++; else full++; });
  const q=quotaOf(shiftId);
  const missingFull=Math.max(0,q.full-full);
  const missingPart=Math.max(0,q.part-part);
  return { full:full, part:part, qFull:q.full, qPart:q.part, missing:missingFull+missingPart, missingFull:missingFull, missingPart:missingPart };
}
function hasWorkOn(eid, ds){
  return db.schedules.some(x=>x.employeeId===eid && x.date===ds && isWorking(x));
}
function hasPref(eid, ds, shiftId){
  const u=userById(eid); if(!u || !Array.isArray(u.prefs)) return false;
  const day=(parseDate(ds).getDay()+6)%7+1;
  return u.prefs.some(p=>p.d===day && p.shiftId===shiftId);
}
function weekScheduleCount(eid, ws){
  let c=0;
  for(let i=0;i<7;i++){ const ds=toDateStr(addDays(ws,i)); if(hasWorkOn(eid,ds)) c++; }
  return c;

function pickPartCandidate(bId, ds, shiftId){

function autoFillWeek(){
  const u=currentUser(); if(!u || u.role!=='manager'){ alert('此功能僅供分店經理使用。'); return; }
  const bId=userBranchId();
  let filled=0;
  for(let i=0;i<7;i++){
    const ds=toDateStr(addDays(state.weekStart,i));
    db.shifts.forEach(sh=>{
      if(sh.isRest) return;
      // 每次重查配額，確保兼職永不超額
      let need=quotaStatus(bId,ds,sh.id).missingPart;
      while(need>0){
        const cand=pickPartCandidate(bId,ds,sh.id);
        if(!cand) break;
        const locs=locOptions(bId);
        db.schedules.push({ id:genId(), branchId:bId, employeeId:cand.id, date:ds, shiftId:sh.id, location:(locs[0]||''), position:cand.defaultPosition||'' });
        db.claims.push({ id:genId(), employeeId:cand.id, branchId:bId, date:ds, shiftId:sh.id, claimedAt:new Date().toISOString(), status:'autofill' });
        filled++; need--;
      }
    });
  }
  saveDB();
  alert('自動填補完成：共填補 '+filled+' 個兼職空缺更份（優先偏好者、公平輪流分配）。');
  go('schedule');
}

function claimShift(ds, shiftId){
  const u=currentUser(); if(!u) return;
  if(u.empType!=='parttime'){ alert('只有兼職員工可以認投空缺更份。'); return; }
  if(!claimOpen(ds)){ alert('認投已截止：'+claimStatusText(ds)+'。'); return; }
  const shift=shiftById(shiftId);
  if(!shift || !shiftAppliesOn(shift, ds)){ alert('該班次不適用於 '+ds+'（星期 / 公眾假期設定不符），請選擇當日適用的班次。'); return; }
  const st=quotaStatus(u.branchId, ds, shiftId);
  if(st.missing<=0 || st.part>=st.qPart){ alert('該更份已滿員或兼職配額已滿（全職 '+st.full+'/'+st.qFull+'、兼職 '+st.part+'/'+st.qPart+'），暫無空缺。'); return; }
  if(hasWorkOn(u.id, ds)){ alert('您當日已有更份，無法再認投。'); return; }
  const locs=locOptions(u.branchId);
  db.schedules.push({ id:genId(), branchId:u.branchId, employeeId:u.id, date:ds, shiftId:shiftId, location:(locs[0]||''), position:u.defaultPosition||'' });
  db.claims.push({ id:genId(), employeeId:u.id, branchId:u.branchId, date:ds, shiftId:shiftId, claimedAt:new Date().toISOString(), status:'claimed' });
  saveDB();
  alert('認投成功：'+ds+' '+shift.name+'（'+shift.start+'-'+shift.end+'）已加入您的更表。');
  go('vacancy');
}

function quotaOf(shiftId){
  const s=shiftById(shiftId);
  return { full:(s&&s.quotaFull)||0, part:(s&&s.quotaPart)||0 };

function quotaStatus(bId, ds, shiftId){
  const schs=db.schedules.filter(x=>x.branchId===bId && x.date===ds && x.shiftId===shiftId && isWorking(x) && !leaveOn(x.employeeId,ds));
  let full=0, part=0;
  schs.forEach(x=>{ const u=userById(x.employeeId); if(u && u.empType==='parttime') part++; else full++; });
  const q=quotaOf(shiftId);
  const missingFull=Math.max(0,q.full-full);
  const missingPart=Math.max(0,q.part-part);
  return { full:full, part:part, qFull:q.full, qPart:q.part, missing:missingFull+missingPart, missingFull:missingFull, missingPart:missingPart };
}

/* ===== v3 定向修復：配額強制 / 偏好總覽 / 空缺週份 ===== */
function enforceQuota(){
  if(!Array.isArray(db.schedules)||!Array.isArray(db.shifts)) return 0;
  if(!Array.isArray(db.quotaCleanup)) db.quotaCleanup=[];
  if(db.quotaCleanupCount==null) db.quotaCleanupCount=0;
  const groups={};
  db.schedules.forEach(s=>{
    const sh=shiftById(s.shiftId);
    if(!sh||sh.isRest) return;
    const key=s.branchId+'|'+s.date+'|'+s.shiftId;
    (groups[key]=groups[key]||[]).push(s);
  });
  let removed=0;
  const dropOne=function(s){
    const idx=db.schedules.findIndex(x=>x.id===s.id);
    if(idx<0) return false;
    db.schedules.splice(idx,1);
    db.quotaCleanup.push({ branchId:s.branchId, date:s.date, shiftId:s.shiftId, employeeId:s.employeeId, removedAt:new Date().toISOString() });
    return true;
  };
  Object.keys(groups).forEach(k=>{
    const arr=groups[k];
    const sh=shiftById(arr[0].shiftId);
    const capFull=sh.quotaFull||0, capPart=sh.quotaPart||0;
    // 兼職超額：保留先排的前 capPart 名兼職，其餘兼職移除
    const parts=arr.filter(s=>{ const uu=userById(s.employeeId); return uu && uu.empType==='parttime'; });
    if(parts.length>capPart){
      const drop=parts.slice(capPart);
      drop.forEach(s=>{ if(dropOne(s)) removed++; });
    }
    // 全職超額：保留先排的前 capFull 名全職，其餘全職移除
    const fulls=arr.filter(s=>{ const uu=userById(s.employeeId); return !uu || uu.empType!=='parttime'; });
    if(fulls.length>capFull){
      const drop=fulls.slice(capFull);
      drop.forEach(s=>{ if(dropOne(s)) removed++; });
    }
  });
  if(db.quotaCleanup.length>200) db.quotaCleanup=db.quotaCleanup.slice(-200);
  if(removed>0){ db.quotaCleanupCount=(db.quotaCleanupCount||0)+removed; saveDB(); }
  return removed;
}
function quotaCleanupBanner(){
  const n=db.quotaCleanupCount||0;
  if(n<=0) return '';
  return '<div class="card" style="border:1px solid #e6a23c;background:#fdf6ec"><div class="card-title" style="color:#c77700">⚠ 配額自動修正</div><div style="font-size:12px;color:#8a6d3b">已自動修正 '+n+' 筆超額排班（優先保留先排者），確保每更份已排人數不超過配額總和。調整配額或修改排班時會再次自動檢查。</div></div>';
}
function prefDayName(d){ const names=['','一','二','三','四','五','六','日']; return (d>=1&&d<=7)?names[d]:('D'+d); }
function renderPrefOverview(){
  const u=currentUser(); if(!u) return '';
  const isBoss=u.role==='boss';
  const branches=isBoss?db.branches:db.branches.filter(b=>b.id===u.branchId);
  let h='<div class="page-title">🕐 兼職偏好總覽</div><div class="page-sub">'+(isBoss?'老闆可查看全部兼職員工的每週偏好。':'僅顯示本分店的兼職員工偏好。')+'</div>';
  branches.forEach(b=>{
    const pts=db.users.filter(x=>x.branchId===b.id && x.empType==='parttime' && x.role==='employee');
    h+='<div class="card"><div class="card-title">'+esc(b.name)+'（兼職 '+pts.length+' 人）</div>';
    if(!pts.length){ h+='<div style="color:var(--muted)">無兼職員工。</div></div>'; return; }
    h+='<table class="data-table"><thead><tr><th>員工</th><th>每週偏好（星期：更份）</th><th>偏好數</th></tr></thead><tbody>';
    pts.forEach(e=>{
      const p=Array.isArray(e.prefs)?e.prefs:[];
      let txt;
      if(!p.length){ txt='<span style="color:var(--muted)">未設定偏好</span>'; }
      else{
        txt=p.map(x=>{ const sh=shiftById(x.shiftId); return '週'+prefDayName(x.d)+'：'+(sh?esc(sh.name):esc(x.shiftId)); }).join('<br>');
      }
      h+='<tr><td>'+esc(e.name)+'<br><small>'+esc(e.username)+'</small></td><td>'+txt+'</td><td>'+p.length+'</td></tr>';
    });
    h+='</tbody></table></div>';
  });
  if(!branches.length){ h+='<div class="card"><div style="color:var(--muted)">無可查看的分店。</div></div>'; }
  return h;
}
function setVacancyWeek(off){ state.vacancyOffset=off; go('vacancy'); }

function isHoliday(ds){ return Array.isArray(db.holidays) && db.holidays.indexOf(ds)>=0; }
function shiftAppliesOn(s, ds){
  if(!s || s.isRest) return true;
  if(!Array.isArray(s.days) || !s.days.length) return true;
  const dow=new Date(ds.replace('-','/').replace('-','/')).getDay();
  const jsDow=(dow+6)%7+1;
  if(isHoliday(ds)) return s.days.indexOf(0)>=0;
  return s.days.indexOf(jsDow)>=0;
}
function applicableShifts(ds){
  return db.shifts.filter(function(s){ return !s.isRest && shiftAppliesOn(s, ds); });
}
function empLabel(emp){
  if(!emp) return '';
  const tag=emp.empType==='parttime'?'（兼）':'（全）';
  return '<span class="emp-tag" style="color:'+(emp.empType==='parttime'?'#B2600E':'#1A5FA8')+'">'+esc(emp.name)+tag+'</span>';
}
function empLabelPlain(emp){
  if(!emp) return '';
  return esc(emp.name)+(emp.empType==='parttime'?'（兼）':'（全）');
}
function renderEmpLegend(){
  return '<div class="card"><div class="card-title">員工類型圖例</div><div class="legend">'+
    '<span class="item"><span class="swatch" style="background:#5C9DFF"></span>全職員工（(全)）</span>'+
    '<span class="item"><span class="swatch" style="background:#FFA94D"></span>兼職員工（(兼)）</span>'+
    '<span class="item"><span class="swatch" style="background:#FFE08A"></span>公眾假期日期（該日僅顯示適用公眾假期之班次）</span>'+
    '</div></div>';
}
function weekWorkStats(eid, bId){
  const ws=toDateStr(state.weekStart); const we=toDateStr(addDays(state.weekStart,6));
  let hours=0, days=0;
  db.schedules.forEach(s=>{
    if(s.employeeId!==eid || (bId && s.branchId!==bId) || !isWorking(s) || leaveOn(s.employeeId,s.date)) return;
    if(s.date<ws || s.date>we) return;
    const st=shiftById(s.shiftId); if(!st) return;
    hours+=hoursBetween(st.start,st.end,st.crossDay,st.break);
    days++;
  });
  return { hours: Math.round(hours*10)/10, days: days };
}
function fulltimeLimitAlert(eid, ds, shiftId){
  const u=db.users.find(x=>x.id===eid); if(!u || u.empType!=='fulltime') return false;
  const st=shiftById(shiftId); if(!st || st.isRest) return false;
  const add=hoursBetween(st.start,st.end,st.crossDay,st.break);
  const hMax=u.ftHoursMax!=null?u.ftHoursMax:40;
  const dMax=u.ftDaysMax!=null?u.ftDaysMax:5;
  let baseH=0, baseD=0;
  db.schedules.forEach(s=>{
    if(s.employeeId!==eid || !isWorking(s) || leaveOn(s.employeeId,s.date)) return;
    if(ds && s.date===ds) return;
    const p=s.date.split('-');
    const sy=parseInt(p[0],10); const sm=parseInt(p[1],10)-1; const sd=parseInt(p[2],10);
    const ws=state.weekStart;
    const t=new Date(sy,sm,sd);
    const w0=new Date(ws.getFullYear(), ws.getMonth(), ws.getDate());
    const a=w0.getTime(), b=t.getTime();
    if(a<=b && b<a+7*86400000){
      const st2=shiftById(s.shiftId); if(!st2) return;
      baseH+=hoursBetween(st2.start,st2.end,st2.crossDay,st2.break);
      baseD++;
    }
  });
  const totalH=Math.round((baseH+add)*10)/10;
  const totalD=baseD+1;
  if(totalH>hMax || totalD>dMax){
    alert('警告：全職員工「'+u.name+'」本週已排 '+baseH+' 小時 / '+baseD+' 日，加上本次新增 '+add+' 小時共 '+totalH+' 小時 / '+totalD+' 日，超過設定上限（每週 '+hMax+' 小時 / '+dMax+' 日）！請留意排班安排。');
    return true;
  }
  return false;
}
function buildCSV(kind, bId){
  const header=['日期','分店','員工','員工類型','班次','開始','結束','跨日','休息時間','地點','崗位'];
  const rows=[];
  function escCSV(v){ const s=String(v==null?'':v); return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
  function pushDay(ds, bid){
    const m=schMap(bid);
    employeesOf(bid).forEach(e=>{
      const sch=m[e.id+'|'+ds];
      const st=sch && isWorking(sch) ? shiftById(sch.shiftId) : null;
      if(st){
        rows.push([ds, branchById(bid).name, e.name, e.empType==='parttime'?'兼職':'全職', st.name, st.start, st.end, st.crossDay?'是':'', st.break||'', sch.location||'', sch.position||'']);
      } else if(leaveOn(e.id,ds)){
        rows.push([ds, branchById(bid).name, e.name, e.empType==='parttime'?'兼職':'全職', '請假', '', '', '', '', '', '']);
      } else if(sch && sch.shiftId==='s_rest'){
        rows.push([ds, branchById(bid).name, e.name, e.empType==='parttime'?'兼職':'全職', '休息', '', '', '', '', '', '']);
      }
    });
  }
  if(kind==='week'){
    const ws=toDateStr(state.weekStart);
    for(let i=0;i<7;i++) pushDay(toDateStr(addDays(parseDate(ws),i)), bId);
  } else if(kind==='day'){
    pushDay(state.dayDate || todayStr(), bId);
  } else if(kind==='month'){
    const dim=new Date(state.monthY, state.monthM+1, 0).getDate();
    for(let d=1; d<=dim; d++) pushDay(toDateStr(new Date(state.monthY, state.monthM, d)), bId);
  }
  const lines=[header.map(escCSV).join(',')];
  rows.forEach(r=> lines.push(r.map(escCSV).join(',')));
  return lines.join('\r\n');
}
function exportCSV(kind){
  const u=currentUser();
  const bId = u.role==='boss' ? (state.bossBranchId || db.branches[0].id) : u.branchId;
  const branch=branchById(bId);
  const csv=buildCSV(kind, bId);
  const blob=new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const datePart = kind==='week' ? toDateStr(state.weekStart) : (kind==='day' ? (state.dayDate||todayStr()) : (state.monthY+'-'+String(state.monthM+1).padStart(2,'0')));
  a.download = '更表_'+branch.name+'_'+kind+'_'+datePart+'.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 300);
  alert('已匯出「'+branch.name+'」'+(kind==='week'?'週更表':kind==='day'?'日視圖':'月視圖')+' CSV。');
}
function addHoliday(){
  const v=document.getElementById('holiday-date').value;
  if(!v){ alert('請先選擇日期。'); return; }
  if(!Array.isArray(db.holidays)) db.holidays=[];
  if(db.holidays.indexOf(v)>=0){ alert('該日期已是公眾假期。'); return; }
  db.holidays.push(v); db.holidays.sort();
  saveDB(); go('shifts');
}
function removeHoliday(ds){
  db.holidays = db.holidays.filter(function(x){ return x!==ds; });
  saveDB(); go('shifts');
}
function renderHolidayCard(){
  let h='<div class="card"><div class="card-title">🗓 公眾假期日期維護</div><div class="page-sub">公眾假期當天僅顯示「適用星期」勾選了「公眾假期」的班次（預設示範假期：2026-10-01 國慶、2026-10-02、2026-12-25 聖誕、2027-01-01 元旦）。</div>';
  h+='<div class="form-row"><label>新增假期</label><input type="date" id="holiday-date"><button class="btn btn-primary btn-sm" onclick="addHoliday()" style="margin-left:8px">新增</button></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';
  if(Array.isArray(db.holidays) && db.holidays.length){
    db.holidays.forEach(function(ds){
      h+='<span class="holiday-chip">'+ds+' <button class="btn btn-danger btn-sm" onclick="removeHoliday(\''+ds+'\')" style="margin-left:4px">✕</button></span>';
    });
  } else h+='<span style="color:var(--muted)">尚無假期資料。</span>';
  h+='</div></div>';
  return h;
}
function toggleFTLimit(uid){
  const el=document.getElementById('sf-type-'+uid); if(!el) return;
  const isPt=el.value==='parttime';
  const hEl=document.getElementById('sf-hmax-'+uid); const dEl=document.getElementById('sf-dmax-'+uid);
  if(isPt){ if(hEl) hEl.parentNode.innerHTML='<span style="color:var(--muted)">—</span>'; if(dEl) dEl.parentNode.innerHTML='<span style="color:var(--muted)">—</span>'; }
}

function autoAssignShift(emp, ds, locs, pos){
  const shiftOrder=['s_early','s_mid','s_late','s_night'];
  const emps=db.users.filter(x=>x.role==='employee' && x.branchId===emp.branchId);
  const off=emps.findIndex(x=>x.id===emp.id);
  if(off<0) return false;
  const locArr = Array.isArray(locs) && locs.length ? locs : [''];
  for(let k=0;k<shiftOrder.length;k++){
    const shiftId=shiftOrder[(off+k)%shiftOrder.length];
    const st=shiftById(shiftId);
    if(!st || !shiftAppliesOn(st,ds)) continue;
    const qst=quotaStatus(emp.branchId,ds,shiftId);
    const dimMiss = emp.empType==='parttime' ? qst.missingPart : qst.missingFull;
    if(dimMiss<=0) continue;
    db.schedules.push({ id:genId(), branchId:emp.branchId, employeeId:emp.id, date:ds, shiftId:shiftId, location:(locArr[Math.abs(off+k)%locArr.length]||''), position:pos||emp.defaultPosition||'' });
    return true;
  }
  return false;
}</script>
